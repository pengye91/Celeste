[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "celeste-dag"
version = "0.1.0"
description = "General-Purpose Dynamic Agentic Workflow Engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Celeste-DAG Contributors" },
]
keywords = ["agent", "workflow", "dag", "llm", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic>=2.0",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite",
    "asyncpg",
    "anthropic",
    "openai",
    "google-generativeai",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["src/celeste_dag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
