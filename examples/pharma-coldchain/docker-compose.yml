# Pharma Cold-Chain: Real Infrastructure Stack
# =============================================
#
# This compose file provisions only the **infrastructure** services that
# the example actually needs (Postgres, Redis, Mailhog). Domain services
# that were previously included (iot-telemetry-server, customs-api,
# celeste-agent) have been removed because they referenced files and
# modules that do not exist in the repo. See:
#
#   - PHARMA-1:  iot-telemetry-server + customs-api tried to run a
#                `server.py` that was never mounted.
#   - PHARMA-14: celeste-agent ran `pip install celeste`, which pulls
#                an unrelated PyPI package and shadows the in-tree
#                engine.
#   - DX-006:    celeste-agent invoked `python -m celeste.core.agent.serve`,
#                a module that does not exist.
#
# To re-enable domain services, add a real server.py to seed_data/ and
# a real `celeste.core.agent.serve` module, then re-enable the entries
# below.
#
# Quick start:
#   cp .env.example .env          # Edit .env with LLM_API_KEY
#   docker compose up -d          # Start infrastructure services
#   python run_local.py           # Run the pharma scenario

version: "3.9"

services:
  # ------------------------------------------------------------------
  # Infrastructure Services
  # ------------------------------------------------------------------

  postgres-hub:
    image: postgres:16-alpine
    container_name: pharma-postgres-hub
    environment:
      POSTGRES_DB: pharma_coldchain
      POSTGRES_USER: celeste
      POSTGRES_PASSWORD: celeste
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed_data/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celeste -d pharma_coldchain"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    container_name: pharma-redis-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  email-gateway:
    image: mailhog/mailhog
    container_name: pharma-email-gateway
    ports:
      - "1025:1025"   # SMTP server
      - "8025:8025"   # Web UI (http://localhost:8025)
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Domain Services (DISABLED — see header above)
  # ------------------------------------------------------------------
  #
  # The following services were removed because their commands referenced
  # files/modules that don't exist in this repo. Re-enable them after
  # providing the missing pieces.
  #
  #   iot-telemetry-server: needs seed_data/server.py
  #   customs-api:          needs seed_data/server.py
  #   celeste-agent:        needs src/celeste/core/agent/serve.py AND
  #                         a mount of the in-tree src/celeste (PHARMA-14)

volumes:
  postgres_data: