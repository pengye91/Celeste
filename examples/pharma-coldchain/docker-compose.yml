# Pharma Cold-Chain: Real Infrastructure Stack
# =============================================
#
# This compose file provisions the infrastructure services the example needs
# (Postgres, Redis, Mailhog) plus a real Celeste agent server for the remote
# tier. The agent server uses the IN-TREE engine via an editable install of
# the local src/celeste package — it never pulls the unrelated public PyPI
# "celeste" package (PHARMA-14) and never references a missing module
# (DX-006: celeste.core.agent.serve now exists, but the pharma wrapper
# examples/pharma-coldchain/serve_agent.py is the canonical entry point).
#
# Quick start:
#   cp .env.example .env          # Edit .env with LLM_API_KEY
#   docker compose up -d          # Start all services
#   python run_remote.py          # Drive the OPA loop against celeste-agent
#
# Local development (no Docker for the agent):
#   docker compose up -d postgres-hub redis-cache email-gateway
#   python serve_agent.py --port 8900
#   python run_remote.py --agent-url ws://localhost:8900/ws

version: "3.9"

services:
  # ------------------------------------------------------------------
  # Infrastructure Services
  # ------------------------------------------------------------------

  postgres-hub:
    image: postgres:16-alpine
    container_name: pharma-postgres-hub
    environment:
      POSTGRES_DB: pharma_coldchain
      POSTGRES_USER: celeste
      POSTGRES_PASSWORD: celeste
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed_data/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celeste -d pharma_coldchain"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    container_name: pharma-redis-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  email-gateway:
    image: mailhog/mailhog
    container_name: pharma-email-gateway
    ports:
      - "1025:1025"   # SMTP server
      - "8025:8025"   # Web UI (http://localhost:8025)
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Celeste Agent Server (remote tier)
  # ------------------------------------------------------------------
  # Runs the pharma-specific agent server via the IN-TREE install. The repo
  # is mounted at /app and celeste is editable-installed from ./src, so the
  # server uses the in-tree engine (NOT the unrelated PyPI "celeste").
  # The serve_agent.py wrapper registers SystemDataToolkit + the pharma
  # cold-chain toolkit and loads seed data into the shared Postgres.

  celeste-agent:
    build:
      context: ..
      dockerfile: examples/pharma-coldchain/Dockerfile.agent
    container_name: pharma-celeste-agent
    depends_on:
      postgres-hub:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://celeste:celeste@postgres-hub:5432/pharma_coldchain"
    command:
      - python
      - examples/pharma-coldchain/serve_agent.py
      - --host
      - "0.0.0.0"
      - --port
      - "8900"
      - --database-url
      - "postgresql+asyncpg://celeste:celeste@postgres-hub:5432/pharma_coldchain"
    ports:
      - "8900:8900"
    restart: unless-stopped

volumes:
  postgres_data:
