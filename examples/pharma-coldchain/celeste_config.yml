# Celeste-DAG Engine Configuration — Pharma Cold-Chain Example
# ==============================================================
#
# All values can be overridden via environment variables or a .env file.
# See .env.example for API keys and connection strings.

environment: local

# ------------------------------------------------------------------
# Database (pointing to docker compose service)
# ------------------------------------------------------------------
database_url: "postgresql+asyncpg://celeste:celeste@localhost:5432/pharma_coldchain"

# ------------------------------------------------------------------
# Redis (for IoT telemetry buffer and LLM result cache)
# ------------------------------------------------------------------
redis_url: "redis://localhost:6379/0"

# ------------------------------------------------------------------
# Engine Tuning
# ------------------------------------------------------------------
max_parallel_subprocesses: 4
max_opa_cycles: 100
max_llm_tokens: 50000
opa_history_max_cycles: 5

# ------------------------------------------------------------------
# Environment Agent Protocol (EAP)
# ------------------------------------------------------------------
snapshot_timeout_ms: 5000
snapshot_full_interval_calls: 10
snapshot_full_interval_seconds: 300
planner_timeout_ms: 60000
planner_max_retries: 2

# ------------------------------------------------------------------
# Evaluator
# ------------------------------------------------------------------
evaluator_cache_enabled: true
evaluator_cache_ttl_seconds: 3600

# ------------------------------------------------------------------
# Pharma-specific service endpoints
# ------------------------------------------------------------------
services:
  iot_telemetry_url: "http://localhost:8080"
  customs_api_url: "http://localhost:8090"
  mailhog_smtp_host: "localhost"
  mailhog_smtp_port: 1025
  mailhog_web_ui: "http://localhost:8025"
