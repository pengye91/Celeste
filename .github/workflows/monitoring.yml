name: Monitoring (CMC)

on:
  push:
    branches: [main, celeste-verification-examples]
  pull_request:
    branches: [main, celeste-verification-examples]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitoring

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: monitoring/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CELESTE_API_URL: http://localhost:8000
