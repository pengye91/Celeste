# Alembic configuration for Celeste-DAG.
#
# The database URL is deliberately left blank here: env.py resolves it from
# celeste.config.settings.EngineSettings (honouring DATABASE_URL env var and
# the project .env file), so the engine and the migrations always agree on a
# single source of truth. This file only carries rendering/timestamp settings.

[alembic]
# Path to the migration environment. ``%(here)s`` expands to the directory
# containing this ini file (src/celeste/migrations/), so the env.py + the
# versions/ directory resolve correctly regardless of the caller's CWD.
script_location = %(here)s

# Template used for NEW migration files. Must be ``script.py.mako`` (the
# Alembic default) so ``alembic revision`` can locate it in script_location.
# We ship our own script.py.mako next to this ini.
# script_template = script.py.mako

# Timezone for the file_template ``%(time)s`` substitution. UTC keeps
# migration ordering deterministic across machines.
timezone = UTC

# File-naming template for new revisions.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate long revision ids in filenames (8 chars is enough to disambiguate).
truncate_slug_length = 40

# Set to true to output SQL rather than running migrations.
# scripting = false

[post_write_hooks]

# the output encoding used when revision files are written from the template
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
